#
# /etc/majestic.yaml -- Xiaomi MJSXJ02HL
#
# Settings that are properties of the board rather than preferences: which SoC
# pins the IR-cut filter and the infrared lamp are wired to. Nothing here is a
# taste decision, and nothing here is Wi-Fi -- a camera assembled by
# tools/build-image.sh has no other way to learn its own wiring, and majestic
# leaves the day/night hardware alone until it does.
#
# tools/build-image.sh applies each line to the majestic.yaml that ships in the
# image, one key at a time. Everything else in that file stays at OpenIPC's
# defaults.
#
# Format:  <section>.<key> = <value>       (# starts a comment)
#
# Values confirmed from https://github.com/OpenIPC/device-mjsxj02hl
#   flash/autoconfig/etc/majestic.yaml, and repeated in usr/sbin/autonight.sh.

# The IR-cut filter is a latching solenoid with two coils: one pulse on pin 1
# swings the filter in for daylight, one on pin 2 swings it out for night.
# irCutSingleInvert -- already in the stock file, and left alone -- is for the
# cheaper one-pin variant, which this camera is not.
nightMode.irCutPin1 = 70
nightMode.irCutPin2 = 68

# The infrared lamp. majestic's web UI greys out its "Light" toggle with
# "nightMode.backlightPin is not configured" until this is set.
nightMode.backlightPin = 54

# Deliberately not set: nightMode.enabled. The device repo's majestic.yaml
# carries it, but that file predates this majestic: the nightMode section of
# the binary in the image (2026-08) has no such key -- colorToGray, irCutPin1,
# irCutSingleInvert, irCutPin2, backlightPin, drc, lightMonitor, lightSensorPin,
# lightSensorInvert, monitorDelay, minThreshold, maxThreshold and no more. The
# pins alone are what arms /night/on, /night/ircut and /night/light.
